spring.jackson.deserialization.fail-on-unknown-properties=true
loot.identity.google.client-id=${GOOGLE_OIDC_CLIENT_ID:}
loot.identity.google.client-secret=${GOOGLE_OIDC_CLIENT_SECRET:}
loot.identity.google.callback-uri=${GOOGLE_OIDC_CALLBACK_URI:}
loot.evidence.enabled=${LOOT_EVIDENCE_ENABLED:false}
loot.evidence.admission-token=${LOOT_EVIDENCE_ADMISSION_TOKEN:}
loot.evidence.participant-maximum=${LOOT_EVIDENCE_PARTICIPANT_MAXIMUM:20}
loot.evidence.session-ttl=${LOOT_EVIDENCE_SESSION_TTL:PT10M}
loot.evidence.environment-expires-at=${LOOT_EVIDENCE_ENVIRONMENT_EXPIRES_AT:1970-01-01T00:00:00Z}
loot.metrics.enabled=${LOOT_METRICS_ENABLED:false}
loot.metrics.read-token=${LOOT_METRICS_READ_TOKEN:}
loot.metrics.source-identity-digest=${LOOT_METRICS_SOURCE_IDENTITY_DIGEST:}
