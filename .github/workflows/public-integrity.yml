name: Public portfolio integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  claims:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test claim verifier
        run: python3 -m unittest scripts/public/test_verify_portfolio_claims.py -v

      - name: Check published case records
        run: python3 -m unittest scripts/public/test_case_records.py -v

      - name: Verify tracked public claims
        run: python3 scripts/public/verify_portfolio_claims.py

  changes:
    runs-on: ubuntu-24.04
    outputs:
      cpp: ${{ steps.changed.outputs.cpp }}
      load: ${{ steps.changed.outputs.load }}
      meta: ${{ steps.changed.outputs.meta }}
    steps:
      - name: Checkout current source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Classify latest push
        id: changed
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" && "$EVENT_ACTION" != "synchronize" ]]; then
            base="$BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            printf 'cpp=true\nload=true\nmeta=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          changed() {
            if git diff --quiet "$base" "$HEAD_SHA" -- "$@"; then
              printf 'false'
            else
              printf 'true'
            fi
          }
          printf 'cpp=%s\n' "$(changed CMakeLists.txt CMakePresets.json cmake contracts game-server scripts/architecture tests)" >> "$GITHUB_OUTPUT"
          printf 'load=%s\n' "$(changed tools/load)" >> "$GITHUB_OUTPUT"
          printf 'meta=%s\n' "$(changed contracts/meta-api meta-server)" >> "$GITHUB_OUTPUT"

  cpp-linux:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-13 libcurl4-openssl-dev libssl-dev ninja-build openssl

      - name: Configure and verify architecture
        run: |
          cmake --preset ci-gcc-debug
          python3 -m unittest discover -s scripts/architecture/tests -p 'test_*.py' -v
          python3 scripts/architecture/check_architecture.py \
            --source-root . \
            --build-dir build/ci-gcc-debug \
            --contract contracts/architecture/target-graph.v1.json \
            --report build/ci-gcc-debug/architecture-report.json

      - name: Build and test
        run: |
          cmake --build --preset ci-gcc-debug
          ctest --preset ci-gcc-debug --output-on-failure

  load-harness:
    needs: changes
    if: needs.changes.outputs.load == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run load harness tests
        run: python3 -m unittest discover -s tools/load/tests -p 'test_*.py' -v

  meta-settlement:
    needs: changes
    if: needs.changes.outputs.meta == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Java 21
        run: |
          sudo apt-get update
          sudo apt-get install --yes openjdk-21-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Run locked Meta checks
        working-directory: meta-server
        run: ./gradlew --no-daemon --dependency-verification strict clean check
